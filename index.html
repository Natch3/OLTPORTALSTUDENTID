<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#0f172a;
            color:#fff;
            flex-direction:column;
        }

        .loader{
            width:80px;
            height:80px;
            border:8px solid rgba(255,255,255,.2);
            border-top:8px solid #38bdf8;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            100%{
                transform:rotate(360deg);
            }
        }

        h2{
            margin-top:25px;
            font-size:28px;
        }

        p{
            margin-top:10px;
            color:#cbd5e1;
        }

        #countdown{
            color:#38bdf8;
            font-weight:bold;
        }
    </style>
</head>
<body>

    <div class="loader"></div>

    <h2>Loading...</h2>

    <p>Redirecting in <span id="countdown">10</span> seconds</p>

    <script>
        let timeLeft = 10;
        const countdown = document.getElementById("countdown");

        const timer = setInterval(() => {
            timeLeft--;
            countdown.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);

                // Change this to your destination
                window.location.href = "https://mirrors-him-wisdom-passing.trycloudflare.com";
            }
        }, 1000);
    </script>

</body>
</html>
